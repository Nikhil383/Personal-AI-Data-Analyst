[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "AI-powered CSV data analyst with FastAPI and CrewAI-ready orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "pyarrow>=17.0.0",
]

[project.optional-dependencies]
agents = ["crewai>=0.80.0"]
notebook = ["ipykernel>=6.29.0", "jupyterlab>=4.3.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
