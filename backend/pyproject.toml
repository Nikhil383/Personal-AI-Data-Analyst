[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Enterprise AI Data Analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "langgraph>=0.0.30",
    "langchain>=0.1.13",
    "langchain-google-genai>=1.0.1",
    "google-generativeai>=0.4.1",
    "pandas>=2.2.1",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.8.0",
    "redis>=5.0.3",
    "pydantic>=2.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
